name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file modification times
        run: |
          # 恢复文件修改时间为 git 提交时间
          # Quartz 使用 mtime 排序，需要正确的文件时间戳
          git restore-mtime 2>/dev/null || \
          git log --pretty=format:%H --name-only | \
          awk '/^[0-9a-f]/ { commit=$1 } /.*/ { print commit, $0 }' | \
          while read commit file; do
            [ -f "$file" ] && touch -d "$(git show -s --format=%ci $commit)" "$file" 2>/dev/null
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build -d ./content -o ./public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4