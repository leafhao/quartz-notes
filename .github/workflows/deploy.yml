name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore file modification times
        run: |
          # 使用 Python 恢复文件修改时间为最后一次提交时间
          # Quartz 使用 mtime 排序，需要正确的文件时间戳
          python3 << 'EOF'
          import os
          import subprocess
          from datetime import datetime
          
          # 获取所有文件的最后提交时间和路径
          result = subprocess.run(
            ['git', 'log', '--pretty=format:%H %ct', '--name-only', '-r'],
            capture_output=True, text=True
          )
          
          file_times = {}
          current_commit = None
          current_time = None
          
          for line in result.stdout.split('\n'):
            if not line.strip():
              continue
            parts = line.split()
            if len(parts) >= 2 and len(parts[0]) == 40:  # commit hash
              current_commit = parts[0]
              current_time = int(parts[1])
            elif current_time and len(parts) == 1:
              filepath = parts[0]
              if filepath not in file_times:  # 只取最早的提交时间（实际是最后修改时间）
                file_times[filepath] = current_time
          
          # 恢复文件时间戳
          for filepath, timestamp in file_times.items():
            if os.path.exists(filepath):
              mtime = timestamp
              os.utime(filepath, (mtime, mtime))
              print(f"Restored: {filepath} -> {datetime.fromtimestamp(mtime)}")
          
          print(f"\nTotal files restored: {len(file_times)}")
          EOF

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build -d ./content -o ./public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5